# Open threads that were deliberately left undone.
#
# Deferring is fine. Deferring silently is how a considered decision becomes a surprise three weeks
# later, when nobody can name what was consciously skipped. `nodekit-submission-prepare` reads this
# file and refuses to report a submission ready while anything here is still `open`.
#
# status: open | resolved | accepted-risk
#   open          — nobody has decided yet. This is the state that blocks.
#   resolved      — it was done. `outcome` says what closed it.
#   accepted-risk — it will not be done, on purpose. `outcome` says why that is acceptable.
#
# Seeded only with threads observed directly. An entry nobody verified is the thing this file exists
# to prevent, and it would be a strange way to start.

deferred:
  - id: docs-onboarding-compact-loop
    what: >-
      test/docs-onboarding "a fresh human or coding agent reaches the compact loop before the
      detailed manual" fails, and fails identically at a clean HEAD with no local changes.
    why: >-
      Observed while verifying the reference-loop and provenance contract work. It is a
      pre-existing failure in the onboarding docs ordering, unrelated to those changes, and folding
      a docs fix into contract commits would have made both harder to review.
    deferredAt: "2026-08-02"
    status: open

  - id: replay-packet-producers
    what: >-
      nodekit.replay-packet/v1 and its ladder evaluator exist, but nothing produces a packet yet.
      The NodeKit thread also specified `nodekit reproduce --run <id> --fresh-worktree`,
      PROMPT_BOOK.md, RECREATE.md, and a typed PromptImprovementRecord; none are built.
    why: >-
      The contract is the part that stops a false claim, and it is worth having before a producer
      exists. Writing producers first would have meant deciding the honesty rules while also
      deciding the plumbing, and the rules are the half that was actually asked for.
    deferredAt: "2026-08-02"
    status: open

  - id: preflight-and-integration-records-unwired
    what: >-
      src/lib/preflight.mjs and src/lib/integration-record.mjs are tested libraries with no caller.
      Nothing runs preflight before a session, and no integrations/*.yaml records exist.
    why: >-
      Wiring preflight to a session start needs a decision about where a session begins for this
      repo, which is a question for the owner rather than an implementation detail to guess at.
    deferredAt: "2026-08-02"
    status: open

  - id: studio-working-tree-edit
    what: >-
      src/studio.mjs carries an uncommitted local modification that predates this session and was
      excluded from all seven contract commits.
    why: >-
      It is the repository owner's in-progress work. Committing someone else's unfinished edit to
      main as a side effect of unrelated schema changes is not a decision this session gets to make.
    deferredAt: "2026-08-02"
    status: open
