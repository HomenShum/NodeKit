schemaVersion: nodekit.repo/v1
repository: HomenShum/node-platform
lifecycle: preview
support: active
role: platform
commandProfile: platform

canonicalFor:
  - nodeplatform.repo-contract
  - nodeplatform.change-story
  - nodekit.knowledge-evolution
  - nodekit.frontend-specialist
  - nodekit.evolution-ledger

consumes:
  - betterprhandoff.handoff
  - betterprhandoff.nodekit-present-receipt
  - featureclip.evidence-manifest
  - featureclip.evidence-receipt
  - nodetasks.corpus-receipt
  - nodeslide.deck
  - nodeslide.deck-patch

commands:
  doctor:
    script: doctor
    mode: finite
  check:
    script: check
    mode: finite

noKey:
  status: not-applicable
  command: null
  externalAccountsRequired: 0
  disclosure: NodeKit is deterministic repository tooling and does not call a model.

environment:
  contractVersion: nodeplatform.env/v1
  status: aligned

proof:
  command: npm run check
  receiptSchema: nodeplatform.conformance/v1

contractDeclarations:
  - concept: nodekit.knowledge-evolution
    signature: knowledge-graph-schema
    path: src/lib/knowledge-evolution.mjs
    mode: canonical
  - concept: nodekit.frontend-specialist
    signature: frontend-route-schema
    path: src/lib/frontend-specialist.mjs
    mode: canonical
  - concept: nodekit.evolution-ledger
    signature: evolution-event-schema
    path: src/lib/evolution-ledger.mjs
    mode: canonical
architectureExceptions: []

# Behavior intent for the generated behavior index (nodekit.behavior-index/v1).
# Small declarations only. Ownership and proof are read from annotations in src/ and test/,
# so implementation and verification state are derived rather than hand-maintained.
behaviors:
  journey.stage.advance:
    statement: A builder case advances a stage only when that stage's handoff artifact exists and a receipt binds it by content hash.
    requiredScenarios:
      - blocked-without-handoff
      - advances-when-bound
      - forged-binding-stays-blocked
  decide.compile-to-build:
    statement: An approved OpportunityContract compiles into the product design contract the build stage reads, carrying the protected decisions.
    requiredScenarios:
      - decisions-carried-and-protected
      - prohibitions-survive
      - packet-accepted-by-planner
  orientation.tour:
    statement: The codebase tour reports a pass only for a step it observed, and exits non-zero when a step it names is genuinely absent.
    requiredScenarios:
      - verified-and-explained-steps-separated
      - fails-closed-on-missing-part
  language.copy-audit:
    statement: Newcomer-facing copy is blocked when it uses a NodeKit term the glossary does not define or does not point a reader to.
    requiredScenarios:
      - undefined-term-blocks
      - unreachable-glossary-blocks
      - identifiers-not-flagged
  studio.motion-portability:
    statement: A copied motion recipe is blocked when one static token name resolves to different behavior, and migration aliases preserve observed values unless a disclosed owner decision changes them.
    requiredScenarios:
      - detects-silent-cross-repo-drift
      - normalizes-equivalent-values
      - incomplete-coverage-is-not-run
      - aliases-preserve-behavior
  runtime.stage-graph:
    statement: The current Caseflow stage compiles deterministically into verified edge-bound work, and only non-conflicting nodes with valid authority enter the runnable frontier.
    requiredScenarios:
      - deterministic-current-stage-only
      - overlapping-writes-excluded
      - mutated-bindings-rejected
      - stale-stage-blocked
      - protected-authority-fails-closed
