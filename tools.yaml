# NodeKit tool operating model — machine-readable registry.
# Source: owner ChatGPT thread "NodeKit tool inventory and use plan" (thread-2026-07-29).
# Placement enum is CLOSED: CORE | CONNECTOR | ADAPTER | APP | REFERENCE | BENCHMARK | DOMAIN.
# journeyStages enum: decide | reference | build | prove | launch | learn.
# `packages` lists the npm package names an APP entry would appear under in a package.json —
# the dependency-free-core gate (scripts/tool-placement-gate.mjs) scans for them.
# `unresolved: true` + `journeyStages: []` means the stage could not be honestly derived
# from the thread; a guessed stage is worse than a declared unknown.
schemaVersion: nodekit.tools/v1
source: thread-2026-07-29

