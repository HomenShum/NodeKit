# Open threads that were deliberately left undone.
#
# Deferring is fine. Deferring silently is how a considered decision becomes a surprise three weeks
# later, when nobody can name what was consciously skipped. `npm run check` reads this file and
# refuses while anything here is still `open`.
#
# status: open | resolved | accepted-risk
#   open          — nobody has decided yet. This is the state that blocks.
#   resolved      — it was done. `outcome` says what closed it.
#   accepted-risk — it will not be done, on purpose. `outcome` says why that is acceptable.
#
# Starts empty on purpose. An entry nobody verified is exactly what this file exists to prevent, so
# it is not seeded with plausible-looking placeholders.

deferred: []
