name: ecosystem conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The clone list comes from repositories.yaml, the same registry
      # `ecosystem check` iterates (every entry whose commandProfile is not
      # "untracked"), so a repository added to the registry is checked out
      # without editing this file. NodeKit is the current checkout, linked in.
      - name: Checkout active repositories
        shell: bash
        run: |
          mkdir -p ../ecosystem
          node -e 'for (const r of require("yaml").parse(require("fs").readFileSync("repositories.yaml", "utf8")).repositories) if (r.commandProfile !== "untracked") console.log(r.name, r.github)' |
          while read -r name github; do
            if [ "$name" = NodeKit ]; then
              ln -s "$PWD" "../ecosystem/${name}"
            else
              git clone --depth 1 "https://github.com/${github}.git" "../ecosystem/${name}"
            fi
          done
      - name: Verify ecosystem
        run: node src/cli.mjs ecosystem check --registry-root . --workspace ../ecosystem
