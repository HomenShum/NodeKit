name: ecosystem conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout active repositories
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import path from "node:path";
          import { loadRegistry, validateRegistry } from "./src/lib/registry.mjs";

          const registry = await loadRegistry(process.cwd());
          const errors = validateRegistry(registry);
          if (errors.length) throw new Error(errors.join("\n"));
          const repositories = registry.repositoryCatalog.repositories.filter((repo) => repo.commandProfile !== "untracked");
          for (const repo of repositories) {
            if (typeof repo.name !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(repo.name) ||
                !/^[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(repo.github)) {
              throw new Error("Invalid ecosystem checkout name or GitHub slug");
            }
          }
          for (const repo of repositories.filter((repo) => repo.name !== "NodeKit")) {
            execFileSync("git", ["clone", "--depth", "1", "--", `https://github.com/${repo.github}.git`, path.join("..", repo.name)], { stdio: "inherit" });
          }
          NODE
      - name: Verify ecosystem
        run: node src/cli.mjs ecosystem check --registry-root . --workspace ..
