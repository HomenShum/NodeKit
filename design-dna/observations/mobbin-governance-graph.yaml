rules:
  - id: rule-governance-graph-1
    statement: A governance graph is scannable when a bounded status strip precedes the graph and exact explanations follow it.
    mechanismHypothesis: Operators decide whether to inspect the topology only after reading the decision state and can verify a failed branch without opening every node.
    confidence: high
    appliesWhen: [one candidate has one current governance decision]
    doesNotApplyWhen: [the operator is comparing more than four candidates]
    evidence:
      - obs-mobbin-n8n-run-evaluation/f1
      - obs-mobbin-github-failed-workflow/f1
      - obs-mobbin-github-failed-workflow/f4
  - id: rule-governance-graph-2
    statement: A selected graph node should update a fixed inspector instead of expanding controls inside the canvas.
    mechanismHypothesis: Stable graph geometry preserves causal scan order while the inspector provides detail on demand.
    confidence: high
    appliesWhen: [the graph contains five or more stages]
    doesNotApplyWhen: [every node has only a label and status]
    evidence:
      - obs-mobbin-stackai-run-detail/f2
      - obs-mobbin-stackai-run-detail/f5
